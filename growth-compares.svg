<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="title">n을 두 배씩 늘릴 때 비교 횟수 (무작위 입력)</title><desc id="desc">n = 1K부터 32K까지 두 배씩 늘리며 센 비교 횟수. 칵테일 정렬은 n이 두 배면 4배, 병합 · 퀵은 2.1~2.2배로 자란다.</desc><style>.surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.ref{stroke:#52514e}.ring{stroke:#fcfcfb}.s0{stroke:#2a78d6} .f0{fill:#2a78d6}.s1{stroke:#eb6834} .f1{fill:#eb6834}.s2{stroke:#1baf7a} .f2{fill:#1baf7a}.s3{stroke:#898781} .f3{fill:#898781}@media (prefers-color-scheme: dark){.surface{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.muted{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ref{stroke:#c3c2b7}.ring{stroke:#1a1a19}.s0{stroke:#3987e5} .f0{fill:#3987e5}.s1{stroke:#d95926} .f1{fill:#d95926}.s2{stroke:#199e70} .f2{fill:#199e70}.s3{stroke:#898781} .f3{fill:#898781}}</style><rect class="surface" width="720" height="420" rx="10"/><text class="ink" x="20.0" y="28.0" font-size="15" text-anchor="start" font-weight="600">n을 두 배씩 늘릴 때 비교 횟수 (무작위 입력)</text><text class="ink2" x="20.0" y="48.0" font-size="12" text-anchor="start">로그-로그 축. 기울기가 차수다: 칵테일은 기울기 2(n²), 병합 · 퀵은 1을 조금 넘는다(n log n).</text><line class="s0" x1="20.0" x2="42.0" y1="72.0" y2="72.0" stroke-width="2" stroke-linecap="round"/><circle class="f0 ring" stroke-width="2" cx="31.0" cy="72.0" r="3.5"/><text class="ink2" x="48.0" y="76.0" font-size="12" text-anchor="start">mergeSort</text><line class="s1" x1="128.6" x2="150.6" y1="72.0" y2="72.0" stroke-width="2" stroke-linecap="round"/><rect class="f1 ring" stroke-width="2" x="136.5" y="68.8" width="6.3" height="6.3" rx="1"/><text class="ink2" x="156.6" y="76.0" font-size="12" text-anchor="start">quickSort</text><line class="s2" x1="237.3" x2="259.3" y1="