<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-labelledby="title desc" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="title">퀵 정렬: 피벗 × 파티션별 비교 횟수 (n = 20,000)</title><desc id="desc">2-way 파티션은 중복많음 입력에서 피벗과 무관하게 비교가 수천만 번으로 치솟는다. 3-way 파티션은 중복에 강하지만 첫 원소 피벗은 역순에서 무너진다.</desc><style>.surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.ref{stroke:#52514e}.ring{stroke:#fcfcfb}.s0{stroke:#2a78d6} .f0{fill:#2a78d6}.s1{stroke:#eb6834} .f1{fill:#eb6834}.s2{stroke:#1baf7a} .f2{fill:#1baf7a}.s3{stroke:#898781} .f3{fill:#898781}@media (prefers-color-scheme: dark){.surface{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.muted{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ref{stroke:#c3c2b7}.ring{stroke:#1a1a19}.s0{stroke:#3987e5} .f0{fill:#3987e5}.s1{stroke:#d95926} .f1{fill:#d95926}.s2{stroke:#199e70} .f2{fill:#199e70}.s3{stroke:#898781} .f3{fill:#898781}}</style><rect class="surface" width="720" height="440" rx="10"/><text class="ink" x="20.0" y="28.0" font-size="15" text-anchor="start" font-weight="600">퀵 정렬: 피벗 × 파티션별 비교 횟수 (n = 20,000)</text><text class="ink2" x="20.0" y="48.0" font-size="12" text-anchor="start">색은 피벗 고르는 법. 로그 축이라 위로 한 칸이면 10배 더 비교한 것이다.</text><circle class="f0 ring" stroke-width="2" cx="25.0" cy="72.0" r="4.0"/><text class="ink2" x="34.0" y="76.0" font-size="12" text-anchor="start">first</text><rect class="f1 ring" stroke-width="2" x="88.2" y="68.4" width="7.2" height="7.2" rx="1"/><text class="ink2" x="100.8" y="76.0" font-size="12" text-anchor="start">random</text><path class="f2 ring" stroke-width="2" d="M165.6,67.0 L170.6,72.0 L165.6,77.0 L160.6,72.0 Z"/><text class="ink2" x="174.6" y="76.0" font-size="12" text-anchor="start">median3</text><text class="muted" x="20.0" y="100.0" font-size="11" text-an