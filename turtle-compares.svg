<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif"><title id="title">버블 정렬(기준선) vs 칵테일 정렬: 비교 횟수 (n = 8,000)</title><desc id="desc">두 정렬 모두 flag로 일찍 멈춘다. 거북이 입력에서 버블 정렬은 약 3,200만 번, 칵테일 정렬은 약 2만 4천 번 비교한다. 토끼와 정렬됨에서는 둘이 같다.</desc><style>.surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}.grid{stroke:#e1e0d9}.axis{stroke:#c3c2b7}.ref{stroke:#52514e}.ring{stroke:#fcfcfb}.s0{stroke:#2a78d6} .f0{fill:#2a78d6}.s1{stroke:#eb6834} .f1{fill:#eb6834}.s2{stroke:#1baf7a} .f2{fill:#1baf7a}.s3{stroke:#898781} .f3{fill:#898781}@media (prefers-color-scheme: dark){.surface{fill:#1a1a19}.ink{fill:#ffffff}.ink2{fill:#c3c2b7}.muted{fill:#898781}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.ref{stroke:#c3c2b7}.ring{stroke:#1a1a19}.s0{stroke:#3987e5} .f0{fill:#3987e5}.s1{stroke:#d95926} .f1{fill:#d95926}.s2{stroke:#199e70} .f2{fill:#199e70}.s3{stroke:#898781} .f3{fill:#898781}}</style><rect class="surface" width="720" height="420" rx="10"/><text class="ink" x="20.0" y="28.0" font-size="15" text-anchor="start" font-weight="600">버블 정렬(기준선) vs 칵테일 정렬: 비교 횟수 (n = 8,000)</text><text class="ink2" x="20.0" y="48.0" font-size="12" text-anchor="start">거북이(맨 끝의 최솟값)에서 버블은 n²/2번, 칵테일은 3n번쯤 비교한다. 로그 축이다.</text><circle class="f3 ring" stroke-width="2" cx="25.0" cy="72.0" r="4.0"/><text class="ink2" x="34.0" y="76.0" font-size="12" text-anchor="start">bubbleSort</text><path class="f2 ring" stroke-width="2" d="M126.6,67.0 L131.6,72.0 L126.6,77.0 L121.6,72.0 Z"/><text class="ink2" x="135.6" y="76.0" font-size="12" text-anchor="start">cocktailSort</text><text class="muted" x="20.0" y="100.0" font-size="11" text-anchor="start">비교 횟수</text><line class="grid" x1="64.0" x2="700.0" y1="380.0" y2="380.0" stroke-width="1" shape-rendering="crispEdges"/><text class="muted" x="56.0" y="384.0" font-size="11" text-anchor="end">1K</text><line class="grid" x1="64.0" x2="700.0" y1="327.2" y2="327.2" stroke-width="1" shape-rendering="crispEdges"/><text class="muted" x="56.0" y="331.2" font-size="11" text-anchor="end">10K</text><line class="grid" x1="64.0" x2="700.0" y1="274.4" y2="274.4" stroke-width="1" shape-rendering="crispEdges"/><text class="muted" x="56.0" y="278.4" font-size="11" text-anchor="end">100K</text><line class="grid" x1="64.0" x2="700.0" y1="221.6" y2="221.6" stroke-width="1" shape-rendering="crispEdges"/><text class="muted" x="56.0" y="225.6" font-size="11" text-anchor="end">1M</text><line class="grid" x1="64.0" x2="700.0" y1="168.8" y2="168.8" stroke-width="1" shape-rendering="crispEdges"/><text class="muted" x="56.0" y="172.8" font-size="11" text-anchor="end">10M</text><line class="grid" x1="64.0" x2="700.0" y1="116.0" y2="116.0" stroke-width="1" shape-rendering="crispEdges"/><text class="muted" x="56.0" y="120.0" font-size="11" text-anchor="end">100M</text><line class="axis" x1="64.0" x2="700.0" y1="380.0" y2="380.0" stroke-width="1" shape-rendering="crispEdges"/><text class="muted" x="127.6" y="398.0" font-size="11" text-anchor="middle">무작위</text><g><title>bubbleSort · 무작위 · 비교 31,994,674회</title><circle class="f3 ring" stroke-width="2" cx="116.6" cy="142.1" r="5.0"/><circle cx="116.6" cy="142.1" r="12" fill="transparent"/></g><g><title>cocktailSort · 무작위 · 비교 24,259,789회</title><path class="f2 ring" stroke-width="2" d="M138.6,142.2 L144.8,148.5 L138.6,154.7 L132.3,148.5 Z"/><circle cx="138.6" cy="148.5" r="12" fill="transparent"/></g><text class="muted" x="254.8" y="398.0" font-size="11" text-anchor="middle">정렬됨</text><g><title>bubbleSort · 정렬됨 · 비교 7,999회</title><circle class="f3 ring" stroke-width="2" cx="243.8" cy="332.3" r="5.0"/><circle cx="243.8" cy="332.3" r="12" fill="transparent"/></g><g><title>cocktailSort · 정렬됨 · 비교 7,999회</title><path class="f2 ring" stroke-width="2" d="M265.8,326.1 L272.1,332.3 L265.8,338.6 L259.6,332.3 Z"/><circle cx="265.8" cy="332.3" r="12" fill="transparent"/></g><text class="muted" x="382.0" y="398.0" font-size="11" text-anchor="middle">역순</text><g><title>bubbleSort · 역순 · 비교 31,996,000회</title><circle class="f3 ring" stroke-width="2" cx="371.0" cy="142.1" r="5.0"/><circle cx="371.0" cy="142.1" r="12" fill="transparent"/></g><g><title>cocktailSort · 역순 · 비교 31,996,000회</title><path class="f2 ring" stroke-width="2" d="M393.0,135.9 L399.2,142.1 L393.0,148.4 L386.8,142.1 Z"/><circle cx="393.0" cy="142.1" r="12" fill="transparent"/></g><text class="muted" x="509.2" y="398.0" font-size="11" text-anchor="middle">거북이</text><g><title>bubbleSort · 거북이 · 비교 31,996,000회</title><circle class="f3 ring" stroke-width="2" cx="498.2" cy="142.1" r="5.0"/><circle cx="498.2" cy="142.1" r="12" fill="transparent"/></g><g><title>cocktailSort · 거북이 · 비교 23,994회</title><path class="f2 ring" stroke-width="2" d="M520.2,300.9 L526.5,307.1 L520.2,313.4 L514.0,307.1 Z"/><circle cx="520.2" cy="307.1" r="12" fill="transparent"/></g><text class="muted" x="636.4" y="398.0" font-size="11" text-anchor="middle">토끼</text><g><title>bubbleSort · 토끼 · 비교 15,997회</title><circle class="f3 ring" stroke-width="2" cx="625.4" cy="316.4" r="5.0"/><circle cx="625.4" cy="316.4" r="12" fill="transparent"/></g><g><title>cocktailSort · 토끼 · 비교 15,997회</title><path class="f2 ring" stroke-width="2" d="M647.4,310.2 L653.6,316.4 L647.4,322.7 L641.1,316.4 Z"/><circle cx="647.4" cy="316.4" r="12" fill="transparent"/></g></svg>
